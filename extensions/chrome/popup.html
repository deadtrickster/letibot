<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 320px; margin: 0; font: 13px/1.45 -apple-system, Segoe UI, Roboto, sans-serif;
    color: #1a1a1a; background: #fff; }
  @media (prefers-color-scheme: dark) { body { background: #1e1e1e; color: #e6e6e6; } }
  header { padding: 9px 12px; font-weight: 600; border-bottom: 1px solid rgba(128,128,128,.25);
    display: flex; align-items: center; gap: 8px; }
  header .dot { margin-left: auto; }
  section { padding: 10px 12px; }
  h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .55; margin: 0 0 7px; }
  select, button { width: 100%; box-sizing: border-box; font: inherit; border-radius: 7px; padding: 6px 8px; }
  select { border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; }
  button { border: 0; font-weight: 600; cursor: pointer; margin-top: 6px; }
  .primary { background: #128a86; color: #fff; }
  .ghost { background: rgba(128,128,128,.15); color: inherit; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #bbb; }
  .dot.ok { background: #2e7d32; } .dot.bad { background: #c0392b; }
  .msg { font-size: 12px; opacity: .8; min-height: 15px; margin-top: 6px; }
  a { color: inherit; opacity: .7; font-size: 12px; }
  .toggle { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .toggle input { width: auto; margin: 0; }
</style>
</head>
<body>
  <header>letibot <span class="dot" id="dot" title="bridge"></span></header>
  <section>
    <h2>Session for <span id="site"></span></h2>
    <select id="session"></select>
    <button class="primary" id="page">Ask about this page</button>
    <button class="ghost" id="shot">Screenshot a region</button>
    <div class="msg" id="msg"></div>
  </section>
  <section>
    <h2>Drive this tab</h2>
    <label class="toggle"><input type="checkbox" id="drive"> <span id="drivelabel">Let the session drive this tab</span></label>
    <div class="msg" id="drivemsg"></div>
    <a href="options.html" target="_blank">Options (token, port)</a>
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>

[workspace]
resolver = "3"
members = [
    "crates/transcript",
    "crates/dialect",
    "crates/dialect-glm",
    "crates/dialect-qwen",
    "crates/tokencore",
    "crates/http",
    "crates/flowy",
    "crates/provider",
    "crates/websearch",
    "crates/webfetch",
    "crates/backend",
    "crates/turn",
    "crates/sessionlog",
    "crates/tui",
    "crates/ui",
    "crates/tools",
    "crates/code",
    "crates/harnessd",
    "crates/opencode",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/deadtrickster/letibot"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
letibot-transcript = { path = "crates/transcript" }
letibot-dialect = { path = "crates/dialect" }
letibot-dialect-glm = { path = "crates/dialect-glm" }
letibot-dialect-qwen = { path = "crates/dialect-qwen" }
letibot-tokencore = { path = "crates/tokencore" }
letibot-http = { path = "crates/http" }
letibot-flowy = { path = "crates/flowy" }
letibot-provider = { path = "crates/provider" }
letibot-websearch = { path = "crates/websearch" }
letibot-webfetch = { path = "crates/webfetch" }
letibot-backend = { path = "crates/backend" }
letibot-turn = { path = "crates/turn" }
letibot-sessionlog = { path = "crates/sessionlog" }
letibot-tui = { path = "crates/tui" }
letibot-ui = { path = "crates/ui" }
letibot-tools = { path = "crates/tools" }
letibot-code = { path = "crates/code" }
letibot-harnessd = { path = "crates/harnessd" }
letibot-opencode = { path = "crates/opencode" }

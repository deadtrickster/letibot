[workspace]
resolver = "3"
members = [
    # **First because it is the bottom**: `letibot-vt` depends on nothing at all — not on
    # another crate here, not on one outside. It is a screen model, and a screen model that
    # needed a palette or a session type could not be tested without one.
    "crates/vt",
    "crates/transcript",
    "crates/dialect",
    "crates/dialect-glm",
    "crates/dialect-qwen",
    "crates/tokencore",
    # The event table's type and its non-blocking channel (and, behind `store`, the writer
    # thread and the `letibot stats` reader) — docs/metrics.md, TODO R81.
    "crates/metrics",
    # The GGUF vocabulary, and the only crate that links llama.cpp (see its Cargo.toml).
    "crates/llama",
    "crates/http",
    "crates/flowy",
    # **The room**: one host's agents, one queue per tag, a claim as a lease with a beat. A pure
    # state machine and a wire — no store, no socket, no clock — because the coordinator daemon
    # that owns the socket is a later slice, and the semantics are what must be right first.
    "crates/room",
    "crates/provider",
    "crates/websearch",
    "crates/webfetch",
    "crates/backend",
    "crates/turn",
    "crates/sessionlog",
    "crates/tui",
    "crates/ui",
    "crates/tools",
    "crates/code",
    # The plugin layer stack: scope resolution, hot reload and the shadow gate. It carries no
    # wasm engine — a `Loader` is the seam — so it is testable with fakes and its tests never
    # compile a module.
    "crates/plugins",
    # **The hook contracts, for both sides of the wire.** Compiled into the daemon, which builds
    # every hook's input and reads its answer, and into a guest plugin, which does the opposite —
    # so a renamed field breaks a compilation rather than a sentence, the way
    # `crates/sessionlog/src/pane.rs` does for the pane.
    "crates/plugin-sdk",
    # **The plugin layers the binary carries** (`docs/plugins-plan.md` §7 step 10): its build
    # script compiles `plugins/builtin/*` for `wasm32-unknown-unknown` into `OUT_DIR`, and the
    # crate is the table a stack reads its `builtin` scope from. Next to the stack because it is
    # the stack's bottom layer, one level further in.
    "crates/builtins",
    "crates/harnessd",
    "crates/opencode",
    # **Reading — and writing — a Claude Code transcript** (Package H): the `cc-`
    # namespace beside `oc-`. The reader turns Claude Code's JSONL into this head's rows;
    # the writer turns this head's rows back into a transcript `claude --resume` opens, so
    # a conversation can leave in the direction it arrived.
    "crates/claude",
    # Another head, and the one that is a program rather than a screen: the Claude Code
    # bridge (docs/claude-code-bridge.md) reaches the daemon over the same socket the TUI
    # does, and holds a session rather than running one.
    "crates/bridge",
    # **The one binary, last, because it depends on the roles' crates.** Everything
    # above is a library or a role's own executable; this is the multicall that will
    # absorb them. It sits at the bottom of the list so the direction of the
    # dependency is legible — `letibot` reaches in, nothing reaches out.
    "crates/letibot",
]

# **The example plugins are not crates of this workspace.** `plugins/examples/*` are guest modules
# for another host's ABI, copied into a project's `.letibot/plugins/`; each has its own empty
# `[workspace]` table as well, so `cargo test --workspace` neither builds nor gates them.
exclude = ["plugins"]

[workspace.package]
# **ONE version for the whole tree, and it is the release tag's other half.**
#
# The release workflow refuses a tag that disagrees with this, because the two
# numbers becoming different is a defect with no symptom until it is an update
# loop: rano's `v0.1.1` was tagged with the manifest still at 0.1.0, so the
# published binary reported 0.1.0 and every 0.1.0 install was offered 0.1.1 for
# ever. One place to change, and a check that the tag matched it.
#
# **0.2.0 rather than 0.1.3, and it is a decision rather than a default.** This release
# carries `PROTOCOL_VERSION` 26 -> 27, and a protocol bump is the one change in this tree
# that makes a correct head and a correct daemon refuse each other — by name, with a `Bye`
# and no `Hello`, which is a clean refusal and still a broken install. The version string
# is what a person reads before upgrading one half and not the other, so it is the only
# place that warning can be given.
#
# **0.3.0 rather than 0.2.4, for that reason and by that rule.** `v0.2.3` — the last
# release — spoke `PROTOCOL_VERSION` 27, and this tree speaks 36. That is not a batch of
# fixes the pairing survives: it is the one change that makes a correct head and a correct
# daemon refuse each other by name. `v0.2.1`, `v0.2.2` and `v0.2.3` were patch bumps
# precisely because the pairing did not move; this one moves, so the minor does too.
#
# **For a `0.x` tree the MINOR is the compatibility slot.** `^0.1.2` means
# `>=0.1.2, <0.2.0`, exactly as `^1.2` means `<2.0` — so a minor bump is what tells
# somebody pairing two installs that the pairing may no longer hold, and a patch bump
# tells them it will. `v0.1.2` carried a protocol bump (25 -> 26) as a *patch*, and that
# is the precedent this deliberately does not follow: it is the shape that made a wire
# break invisible in a number that promised compatibility. leticl pins this tree by tag
# (`LETIBOT_REF`) and must move that pin either way, so the number costs nobody a
# mechanism; it is read by a human, and it has exactly one job.
#
# **0.4.0 rather than 0.3.1, by the same rule.** `v0.3.0` spoke `PROTOCOL_VERSION` 36 and
# this tree speaks 48, so a v0.3.0 head and this daemon refuse each other by name. The
# release exists for the launcher (no `--provider` gate, `leticode` installed) and those
# would have been a patch on their own; the protocol is what makes it a minor.
#
# **0.5.0 rather than 0.4.1, by the same rule.** `v0.4.0` spoke `PROTOCOL_VERSION` 48 and
# this tree speaks 54. It is also the first release that builds the built-in plugin layers
# (R2), so every machine that builds it needs the `wasm32-unknown-unknown` target.
#
# **0.5.1**: the `v0.5.0` tag was pushed before the release workflow could build the
# built-in plugins on a fresh runner, so it has no release behind it; same protocol (54).
version = "0.5.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/deadtrickster/letibot"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The one TOML the tree parses with a real parser: `prompts.toml` carries
# arbitrary prompt text (multi-line, quoted, escaped), which is a different
# class from the flat `key = "value"` subset `providers.toml` and `head.toml`
# hand-parse. A hand-rolled string parser for prompt bytes is the mangled-prompt
# defect this avoids, and the parser's own message is what a malformed file is
# reported with.
toml = "0.8"
letibot-vt = { path = "crates/vt" }
letibot-llama = { path = "crates/llama" }
letibot-transcript = { path = "crates/transcript" }
letibot-dialect = { path = "crates/dialect" }
letibot-dialect-glm = { path = "crates/dialect-glm" }
letibot-dialect-qwen = { path = "crates/dialect-qwen" }
letibot-tokencore = { path = "crates/tokencore" }
letibot-metrics = { path = "crates/metrics" }
letibot-http = { path = "crates/http" }
letibot-flowy = { path = "crates/flowy" }
letibot-room = { path = "crates/room" }
letibot-provider = { path = "crates/provider" }
letibot-websearch = { path = "crates/websearch" }
letibot-webfetch = { path = "crates/webfetch" }
letibot-backend = { path = "crates/backend" }
# `default-features = false`: their default is `local` (llama.cpp, for their own tests);
# a dependent gets it only through harnessd's `local`, so the head never links libllama.
letibot-turn = { path = "crates/turn", default-features = false }
letibot-sessionlog = { path = "crates/sessionlog", default-features = false }
letibot-tui = { path = "crates/tui" }
letibot-ui = { path = "crates/ui" }
letibot-tools = { path = "crates/tools" }
letibot-code = { path = "crates/code" }
letibot-plugins = { path = "crates/plugins" }
letibot-plugin = { path = "crates/plugin-sdk" }
letibot-builtins = { path = "crates/builtins" }
letibot-harnessd = { path = "crates/harnessd", default-features = false }
letibot-opencode = { path = "crates/opencode" }
letibot-claude = { path = "crates/claude" }
letibot-bridge = { path = "crates/bridge" }

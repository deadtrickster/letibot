name: Release

# Assets, built on a tag. This is what install.sh downloads:
#
#   curl -fsSL https://raw.githubusercontent.com/deadtrickster/letibot/main/install.sh | sh
#
# asks for `letibot-<triple>.tar.gz` at `releases/latest/download/`, holding at the
# archive root:
#
#   harnessd letibot-tui letibot-askpass          the runtime
#   libllama.so.0 libggml.so.0 libggml-cpu.so.0 libggml-base.so.0  what harnessd links
#
# `scripts/make-dist.sh` produces exactly that and asserts the contents; both this
# workflow and `scripts/check-dist-names.sh` pin the names to install.sh's, so an
# asset cannot be published under a name the installer does not ask for.

on:
  push:
    tags: ['v*']
  # Build the assets without publishing, to test a change to this file.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # **A tag, not a branch** — the same `v0.3.0` CI uses, and for the reason the CI
  # comment gives in full: a release must be REBUILDABLE. Re-running an old tag's
  # workflow against a moving `master` would compile a different binary from the one
  # that was tested and published, which is the same defect in a different coat.
  LLAMA_REF: v0.3.0

jobs:
  # Runs first and cheaply, so a mismatch fails before two runners are spent.
  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The names must be the ones install.sh asks for
        run: sh scripts/check-dist-names.sh

      # **The tag and the compiled version must agree.** This is checked by
      # `scripts/check-tag.sh` rather than inline, because it is then runnable by
      # hand — and the defect it catches has no symptom until it is an update loop:
      # rano's `v0.1.1` shipped assets whose binary reported 0.1.0, and since an
      # update check compares the TAG against the compiled version, every install was
      # offered 0.1.1 forever.
      #
      # Only on a tag: a branch build has no version to agree with.
      - name: The tag must match the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh scripts/check-tag.sh "$GITHUB_REF_NAME"

  build:
    needs: names
    runs-on: ${{ matrix.runs }}
    timeout-minutes: 60
    # **The names `crates/tokencore/build.rs` reads**, set here rather than on the
    # individual steps: `Build` and `Package` both need them, and a step that forgot
    # would silently fall back to the script's default — `/home/dead/Projects/llama.cpp`,
    # the author's path — and fail with a message about a directory no runner has.
    # `LETIBOT_LLAMA_LIB` is also what `scripts/make-dist.sh` copies the libraries from,
    # so the packaged libraries are the linked ones by construction.
    env:
      LETIBOT_LLAMA_DIR: ${{ github.workspace }}/llama.cpp
      LETIBOT_LLAMA_LIB: ${{ github.workspace }}/llama.cpp/build/bin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - runs: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          # Apple silicon. install.sh maps `Darwin/arm64` here; an Intel Mac builds from
          # source.
          - runs: macos-14
            triple: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      # The triple is a claim about the binary. Check it against the toolchain's own
      # host rather than trusting the runner image name: a silent change to what
      # `ubuntu-latest` means would otherwise publish an x86_64 binary named aarch64,
      # which install.sh downloads and then fails to execute.
      - name: The runner must be the architecture we are claiming
        run: |
          set -eu
          host=$(uname -m)
          case "${{ matrix.triple }}:$host" in
            x86_64-unknown-linux-gnu:x86_64) ;;
            aarch64-unknown-linux-gnu:aarch64|aarch64-unknown-linux-gnu:arm64) ;;
            aarch64-apple-darwin:arm64) ;;
            *) echo "::error::runner is $host, claiming ${{ matrix.triple }}"; exit 1 ;;
          esac

      # **llama.cpp, CPU only, `$ORIGIN` rpath.** Both halves are load-bearing:
      # the daemon cannot compile without the checkout, and the `$ORIGIN` rpath is what
      # makes the packaged libraries find each other — `DT_RUNPATH` is not inherited by
      # a library's own dependencies, measured, so an absolute runpath in
      # `libllama.so.0` would have it look for `libggml.so.0` in the runner's build
      # directory and nowhere else. `make-dist.sh` refuses to package libraries whose
      # runpath is not `$ORIGIN`, so this fails at packaging rather than at a user's
      # first run if the flag is ever dropped.
      # **`LLAMA_BUILD_APP=OFF` and `LLAMA_BUILD_TOOLS=OFF` are load-bearing**, and the
      # full account is in the CI workflow at the same step. In short: `app/CMakeLists.txt`
      # links all eight `*-impl` libraries, so turning the server off — which removes
      # `llama-server-impl` — fails at 100% on the unified binary's last link. Turning APP
      # off removes the target that wants them; turning TOOLS off skips eight binaries this
      # package never ships. MEASURED on run 36835882659, then verified against v0.3.0 by
      # configuring it and confirming `llama-app` is not among its 18 targets.
      - name: Build llama.cpp (CPU, $ORIGIN rpath)
        if: runner.os == 'Linux'
        run: |
          set -eu
          git clone --depth 1 --branch "$LLAMA_REF" \
            https://github.com/deadtrickster/llama.cpp llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_BUILD_RPATH='$ORIGIN' \
            -DCMAKE_INSTALL_RPATH='$ORIGIN'
          cmake --build llama.cpp/build --config Release -j "$(nproc)"
          # **EXACTLY `$ORIGIN`, and this is an equality rather than a substring match
          # on purpose.** MEASURED on a two-library project: without
          # `CMAKE_BUILD_WITH_INSTALL_RPATH=ON`, the library that depends on another came
          # out as `RUNPATH=[$ORIGIN:/tmp/rpexp/A]` — it still RAN, because `$ORIGIN` is
          # searched first, so nothing would have failed. The release would simply have
          # carried this runner's build path inside a published `.so`. A `grep -q
          # '\$ORIGIN'` passes that; this does not.
          for so in libllama.so.0 libggml.so.0 libggml-cpu.so.0 libggml-base.so.0; do
            rp=$(readelf -d "$LETIBOT_LLAMA_LIB/$so" | sed -n 's/.*RUNPATH.*\[\(.*\)\].*/\1/p')
            echo "$so RUNPATH: [$rp]"
            if [ "$rp" != '$ORIGIN' ]; then
              echo "::error::$so's RUNPATH is [$rp], not exactly [\$ORIGIN]."
              echo "The absolute entries here are build paths from this runner, and"
              echo "they would be baked into an asset people download. Check the"
              echo "CMAKE_BUILD_WITH_INSTALL_RPATH flag above is still present."
              exit 1
            fi
          done

      # **macOS: the same build in dyld's terms.** CPU-only (Metal and BLAS are a Mac's
      # defaults, and each adds a library the archive would have to carry for a daemon that
      # only tokenises), `@loader_path` where Linux says `$ORIGIN`, and the same equality:
      # each library's install name is `@rpath/<name>` and its ONLY rpath is
      # `@loader_path`, so no path from this runner is baked into the asset.
      - name: Build llama.cpp (CPU, @loader_path rpath)
        if: runner.os == 'macOS'
        run: |
          set -eu
          git clone --depth 1 --branch "$LLAMA_REF" \
            https://github.com/deadtrickster/llama.cpp llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_METAL=OFF \
            -DGGML_BLAS=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH=@loader_path
          cmake --build llama.cpp/build --config Release -j "$(sysctl -n hw.ncpu)"
          for so in libllama.0.dylib libggml.0.dylib libggml-cpu.0.dylib libggml-base.0.dylib; do
            id=$(otool -D "$LETIBOT_LLAMA_LIB/$so" | sed -n 2p)
            rp=$(otool -l "$LETIBOT_LLAMA_LIB/$so" | awk '/cmd LC_RPATH/ { getline; getline; print $2 }' | tr '\n' ' ')
            echo "$so: id [$id] rpath [$rp]"
            if [ "$id" != "@rpath/$so" ] || [ "$rp" != "@loader_path " ]; then
              echo "::error::$so is not @rpath/$so with exactly [@loader_path]."
              exit 1
            fi
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - name: Build
        run: cargo build --release --bin harnessd --bin letibot-tui --bin letibot-askpass

      # **The daemon has to run before it is packaged** — and this is the only proof
      # that the `$ORIGIN` runpath works, because the libraries are still where the
      # build put them.
      - name: The binaries must run
        run: |
          set -eu
          ./target/release/harnessd --version
          ./target/release/letibot-tui --version

      - name: Package
        run: sh scripts/make-dist.sh ${{ matrix.triple }} dist

      # **And the PACKAGE must run with nothing else present.** The archive is
      # extracted somewhere else and run with `LD_LIBRARY_PATH` emptied — so the only
      # thing that can satisfy the loader is `$ORIGIN`. This is the check that turns
      # "it worked on the build machine" into "it works on a machine with no
      # llama.cpp", which is every machine but the author's.
      - name: The package must run on its own
        run: |
          set -eu
          d=$(mktemp -d)
          tar -xzf dist/letibot-${{ matrix.triple }}.tar.gz -C "$d"
          n=$(ls -1 "$d" | wc -l)
          test "$n" -eq 8 || { echo "::error::archive holds $n entries, expected 8"; ls -la "$d"; exit 1; }
          ( cd "$d" && env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH ./harnessd --version )
          ( cd "$d" && env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH ./letibot-tui --version )

      - uses: actions/upload-artifact@v4
        with:
          name: letibot-${{ matrix.triple }}
          # The whole dist directory, so the asset name is make-dist.sh's to decide and
          # this file does not restate it.
          path: dist/letibot-${{ matrix.triple }}.tar.gz
          if-no-files-found: error

  # Publishes the assets as a release, which is what makes `releases/latest` resolve.
  # Separate from `build` so a failure to publish does not look like a failure to
  # compile.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -la dist/

      # The same extraction the installer does, run once here so a bad archive is
      # caught at publish time rather than by the first user.
      # **Read from the TAGGED `install.sh`, not from a list written here.**
      #
      # This step used to carry its own copy of the file names, which is the drift
      # shape this repository keeps meeting: the installer says one thing, the
      # publish step says another, and the disagreement is found by whoever runs the
      # one-liner. Reading `install.sh`'s own `BINARIES`/`LIBRARIES` makes it the
      # SAME contract `check-dist-names.sh` asserted before the build, now checked
      # against the bytes that actually came out.
      #
      # The script and the asset do not come from the same ref — the script is served
      # from `main`, the archive from `releases/latest` — so the only thing tying a
      # user's install to a release's contents is that both name the same files.
      - name: Every asset must extract to what install.sh expects
        run: |
          set -eu
          bins=$(sed -n 's/^BINARIES="\(.*\)"$/\1/p' install.sh | head -1)
          libs_linux=$(sed -n 's/^LIBRARIES="\(.*\)"$/\1/p' install.sh | head -1)
          libs_darwin=$(sed -n 's/^LIBRARIES_DARWIN="\(.*\)"$/\1/p' install.sh | head -1)
          [ -n "$bins" ] || { echo "::error::install.sh at this tag has no BINARIES line"; exit 1; }
          [ -n "$libs_linux" ] || { echo "::error::install.sh at this tag has no LIBRARIES line"; exit 1; }
          [ -n "$libs_darwin" ] || { echo "::error::install.sh at this tag has no LIBRARIES_DARWIN line"; exit 1; }
          echo "install.sh at $GITHUB_REF_NAME wants: $bins + $libs_linux (Linux) / $libs_darwin (macOS)"
          for f in dist/*.tar.gz; do
            # A Mac copies LIBRARIES_DARWIN, so the Darwin asset answers to that list.
            case "$f" in
              *-apple-darwin.tar.gz) libs=$libs_darwin ;;
              *) libs=$libs_linux ;;
            esac
            d=$(mktemp -d)
            tar -xzf "$f" -C "$d"
            for want in $bins $libs; do
              [ -f "$d/$want" ] || { echo "::error::$f is missing $want, which install.sh copies"; exit 1; }
            done
            for want in $bins; do
              [ -x "$d/$want" ] || { echo "::error::$f: $want is not executable"; exit 1; }
            done
            rm -rf "$d"
          done
          echo "$(ls dist/*.tar.gz | wc -l) assets, all complete"

      # `gh` rather than a release action: it is already on the runner, so this is one
      # less third-party action to trust in the path that publishes binaries people
      # download and run.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes dist/*.tar.gz
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'

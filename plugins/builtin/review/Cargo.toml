[package]
name = "letibot-builtin-review"
version = "0.1.0"
edition = "2024"
publish = false
description = "the reviewer's brief: the rules a gatekeeper child judges a branch by, as a layer a project can replace"

# **Not a member of letibot's workspace, deliberately.** This crate is a GUEST: `crates/builtins`'
# build script compiles it for `wasm32-unknown-unknown` and the module is `include_bytes!`d into
# the binary. The root manifest excludes `plugins`, so the workspace never builds a `cdylib` for
# the host.
[workspace]

[lib]
# `cdylib` is the module the host loads; `rlib` is what this crate's own tests link — the words and
# the rendering are what a reviewer reads, and they are worth testing where they live: natively,
# with no engine and no wasm toolchain in the way.
crate-type = ["cdylib", "rlib"]

[dependencies]
# rano ABI v1 — the input region, the answer arena and the result block.
letibot-guest-abi = { path = "../abi" }
# **The hook's contract, from the crate that compiles into the host too**: the entry the host hands
# in and the brief it takes back are `letibot_plugin::review`'s, so a field renamed on one side
# breaks the other's build.
letibot-plugin = { path = "../../../crates/plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A guest module is embedded in the daemon's binary, so its size is the binary's size.
opt-level = "s"
strip = true
lto = true
panic = "abort"

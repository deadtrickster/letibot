[package]
name = "letibot-builtin-irc"
version = "0.1.0"
edition = "2024"
publish = false
description = "the top-level session list as an IRC channel's nick list: marks, one fact, one key to switch"

# **Not a member of letibot's workspace, deliberately.** This crate is a GUEST: `crates/builtins`'
# build script compiles it for `wasm32-unknown-unknown` and the module is `include_bytes!`d into
# the binary. The root manifest excludes `plugins`, so the workspace never builds a `cdylib` for
# the host.
[workspace]

[lib]
# `cdylib` is the module the host loads; `rlib` is what this crate's own tests link — the sort
# rule, the column's arithmetic and the marks are policy a project overrides, and they are worth
# testing where they live: natively, with no engine and no wasm toolchain in the way.
crate-type = ["cdylib", "rlib"]

[dependencies]
# rano ABI v1 — the input region, the answer arena and the result block.
letibot-guest-abi = { path = "../abi" }
# **The pane contract, from the crate that compiles into the host too**: the input it is handed and
# the cells, roles and acts it answers with are `letibot_plugin::pane`'s, so a field renamed on one
# side breaks the other's build.
letibot-plugin = { path = "../../../crates/plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A guest module is embedded in the daemon's binary, so its size is the binary's size.
opt-level = "s"
strip = true
lto = true
panic = "abort"

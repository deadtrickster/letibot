name = "irc"
purpose = "this host's top-level sessions as an IRC channel's nick list: who is here, who is busy, and one key to switch to them"
hooks = ["pane_nicks"]
# **Nothing.** Everything this pane draws is in the `sessions` feed the host already holds and
# adjudicates nothing about (`docs/plugins-plan.md` §4.9, "Feeds"), so the layer runs no program,
# reads no file and asks nobody.
capabilities = []
feeds = ["sessions"]
# **What its rows may ask the host to do**: `switch` to a session. The four keys the pane binds
# (`w` wider, `n` narrower, `h` hide, `s` scope) are row ACTIONS, not acts — they call this layer
# back with an `event` word and the host performs nothing on its behalf, so they need no word
# here. `switch` does: it is the host's own verb, and a view that carries one is refused unless
# the manifest declared it (`View::validate_for`).
actions = ["switch"]
contract = 1

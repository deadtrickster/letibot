[package]
name = "letibot-builtin-compact"
version = "0.1.0"
edition = "2024"
publish = false
description = "the harness's own compaction record as the built-in `compact` layer: its sections, and the project's rules pinned verbatim"

# Not a workspace member, deliberately: this crate is a GUEST, built by `crates/builtins`' build
# script for `wasm32-unknown-unknown`, and its module is `include_bytes!`d into the daemon.
[workspace]

[lib]
# `cdylib` is the module the host loads; `rlib` is what this crate's own tests link, so the choice
# of sections and pins is tested natively, with no engine and no wasm toolchain in the way.
crate-type = ["cdylib", "rlib"]

[dependencies]
letibot-guest-abi = { path = "../abi" }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"

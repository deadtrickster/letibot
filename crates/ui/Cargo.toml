[package]
name = "letibot-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# One dependency, and it is a decision rather than an omission.
#
# This crate is the *rendering primitives* half of a head: measure a string in
# terminal columns, wrap it, colour a code block, draw a diff, lay out a tool
# card, edit a line. Nearly every one of those has a well-known crate behind it
# (`unicode-width`, `unicode-segmentation`, `syntect`, `similar`, `tui-textarea`)
# and reaching for them would be the ordinary choice.
#
# It is not the choice here for the same reason `letibot-turn` writes its own
# HTTP and `letibot-tui` writes its own `termios`: what a head needs is a small,
# exactly-understood subset, and the general library brings a theme format, a
# grapheme database, or an event loop that would then be the second one in the
# process. Every module states what subset it implements and — more usefully —
# what it does not, so the next reader can tell a deliberate gap from a bug.
#
# The bound this puts on us: when a module here grows past "the subset a head
# needs", it should be deleted and replaced by the real crate, not extended.
#
# The exception is `rano` (`~/Projects/rano`), and the reason is the reverse of
# the rule: its tree-sitter engine is a *smaller* subset than anything this
# crate could grow on its own — six grammars, one capture walk, no theme
# format, the palette left to the caller. Writing a second tree-sitter
# integration to colour the two-panel diff would have been the second one in
# the process. The absolute path is deliberate: rano is an operator-local
# project, not a published crate, and a relative path would resolve differently
# from this repo's nested checkout than from a sibling worktree.
#
# It still depends on no *letibot* crate for its TYPES. A rendering primitive that
# knows what a `ToolOutcome` is cannot be tested without the transcript, and a head that
# wants to draw something the transcript does not model has to fork it. So the types
# here are the display's own, and the mapping from engine types to them lives in the
# head — one `From` impl in `letibot-tui`, not a dependency edge there.
#
# **The one edge below is not that, and the difference is worth keeping.**
# `letibot_transcript::sanitize` is a pair of pure `&str -> String` functions — no
# transcript type appears in either signature — and it has to have **one** definition
# because the other caller cannot see this crate: `letibot-sessionlog` builds a tool
# call's display target out of the model's own arguments, so it is content this daemon
# did not write and has to be guarded where the text still has its introducer. The
# alternative is a second copy of a sequence parser, which is the duplicate this tree
# keeps deleting. Used through `crate::text`, which is the forward.

[dependencies]
rano = { git = "https://github.com/deadtrickster/rano", tag = "v0.8.1" }
letibot-transcript.workspace = true
# **The third edge, and it is the same argument as the first two.**
#
# `letibot-vt` is the screen model a pane will draw a full-screen program into, and it is
# below this crate on purpose: it is a grid of cells and the bytes that fill it, with no
# opinion about a role, a theme or a head. Two things here read it.
#
#   * `ansi.rs` reads `Attr` and `apply_sgr` — the walk that turns an SGR parameter list
#     into a pen. That walk *was* in this crate, as `Wanted`/`apply`, and it moved down
#     because a screen is a second reader of the same parameters: `Screen::feed` reads a
#     whole program's byte stream into the same pen, and a second copy of the table would be
#     a second answer to what `38;5;1` means. What stays in `ansi.rs` is the half that is
#     this head's own: which `Role` a pen is drawn as.
#   * `width.rs`'s test module reads `letibot_vt::width::char_width`, to check that the
#     East-Asian table this tree measures with and the one a cell grid measures with agree.
#     They are two functions and not one — see that test for which ranges differ and why.
#
# Neither edge puts a `Role`, a `Palette` or a session type in the screen model: it knows
# what a program asked the *terminal* for and nothing about what this head means by it.
letibot-vt.workspace = true

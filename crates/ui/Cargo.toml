[package]
name = "letibot-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No dependencies, and that is a decision rather than an omission.
#
# This crate is the *rendering primitives* half of a head: measure a string in
# terminal columns, wrap it, colour a code block, draw a diff, lay out a tool
# card, edit a line. Every one of those has a well-known crate behind it
# (`unicode-width`, `unicode-segmentation`, `syntect`, `similar`, `tui-textarea`)
# and reaching for them would be the ordinary choice.
#
# It is not the choice here for the same reason `letibot-turn` writes its own
# HTTP and `letibot-tui` writes its own `termios`: what a head needs is a small,
# exactly-understood subset, and the general library brings a theme format, a
# grapheme database, or an event loop that would then be the second one in the
# process. Every module states what subset it implements and — more usefully —
# what it does not, so the next reader can tell a deliberate gap from a bug.
#
# The bound this puts on us: when a module here grows past "the subset a head
# needs", it should be deleted and replaced by the real crate, not extended.
#
# It also depends on no *letibot* crate. A rendering primitive that knows what a
# `ToolOutcome` is cannot be tested without the transcript, and a head that wants
# to draw something the transcript does not model has to fork it. So the types
# here are the display's own, and the mapping from engine types to them lives in
# the head — one `From` impl in `letibot-tui`, not a dependency edge here.

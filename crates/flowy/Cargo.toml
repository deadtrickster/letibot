[package]
name = "letibot-flowy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The `Condition` seam the inbox implements, the `Tool` trait the `flowy` verb
# implements, and nothing else from the runtime.
letibot-tools.workspace = true
# One framing implementation for the whole tree — see that crate's docs.
letibot-http.workspace = true
serde.workspace = true
# preserve_order for the reason every crate in this tree needs it: a tool call's
# argument key order becomes prompt bytes on the next turn.
serde_json = { workspace = true, features = ["preserve_order"] }
# `kill(pid, 0)` for the waiter claim — the same liveness test flowy's own
# `waiterlock.go` makes, so the two guards read each other's files.
libc = "0.2"

[dev-dependencies]
letibot-tools = { workspace = true, features = ["testing"] }

[package]
name = "letibot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# **THE ONE BINARY.** Every role letibot can play is a mode of this executable, so an
# install puts down ONE file plus its libraries instead of one per role. The roles that
# something *else* invokes — `sudo` runs the askpass helper, the fidelity gate runs the
# renderers — are reached by argv[0] through a symlink of the role's own name, because
# neither of those callers knows about subcommands. See `src/main.rs`.
[[bin]]
name = "letibot"
path = "src/main.rs"

[dependencies]
# The askpass role's whole surface: attach to the daemon and carry one question.
letibot-sessionlog.workspace = true
# The render role: `cli::run` is the renderer, moved out of its bin so this
# dispatcher and that binary are one implementation.
letibot-dialect-glm.workspace = true
letibot-dialect-qwen.workspace = true
# The `m1` role: `m1::run` is that binary's body, moved into this crate's lib.
letibot-harnessd.workspace = true
# The `Head` role: `head::run` is that binary's body, moved into this crate's lib.
letibot-tui.workspace = true
# The launcher role: a workspace hashes to a socket, and the key must match the
# shell's `sha256sum | cut -c1-12` exactly or the port names a different daemon.
sha2 = "0.10"
# The record beside a socket is flat JSON, written by whichever launcher started
# the daemon; reading it must survive a stale or half-written file.
serde_json.workspace = true

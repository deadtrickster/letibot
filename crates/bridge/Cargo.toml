[package]
name = "letibot-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The Claude Code bridge (docs/claude-code-bridge.md): an MCP server over stdio that holds
# leticode sessions as a HEAD rather than a process it runs once, plus the `wait` verb a
# background command uses to wake Claude up.
[[bin]]
name = "letibot-mcp"
path = "src/main.rs"

[dependencies]
# The wire, and the head half of it: `HeadClient` is the three obligations a head owes
# (attach with a seq, ack after handling, expected_seq on every mutating frame), and this
# bridge is a head with no screen.
letibot-sessionlog.workspace = true
# A transcript row is the source of the last assistant message, and it is this crate's
# type — the session log re-exports its rows, and matching on them needs the type named.
letibot-transcript.workspace = true
serde_json.workspace = true
# **Where a host name is checked, and it is the tree's one reader** (`crates/tools/src/remote.rs`,
# RH5): `~/.config/letibot/hosts.toml`, parsed strictly, with the refusal that lists the declared
# names. `leticode_start { host }` needs exactly that and must give exactly that refusal — a
# second reader here would be the drift RH5 removed, and a name this file accepted would be one
# the daemon then refused at its own start. `Placement` comes with it: one spelling of `host` and
# `host:NAME` for the bridge, the daemon and a recorded subagent.
letibot-tools.workspace = true
# The socket's name is the first twelve hex of the workspace's SHA-256, exactly as
# `scripts/letibot` derives it (`sha12`): a different hash names a socket no daemon
# listened on and starts a second one for one folder.
sha2 = "0.10"
# `setsid(2)`, for starting a daemon that does not die with the MCP process that spawned
# it — the same detachment `scripts/letibot`'s `detach` gets from `setsid`/perl.
libc = "0.2"

[dev-dependencies]
# **The fixture that writes an executable needs `write_stub`**, which is the one place in this tree
# that closes the `ETXTBSY` window a written-then-exec'd file has (`crates/tools/src/testing.rs`,
# and `daemon::tests`' reaper test is the caller). Asking for the feature HERE rather than on the
# dependency above is the tree's shape for that: a bridge binary has no use for a fixture.
letibot-tools = { workspace = true, features = ["testing"] }
# **A real daemon, in this process.** The end-to-end test is the daemon's own
# `Daemon::serve` over a `Registry` plus `Sessions::open_first`, exactly as harnessd's
# integration tests build one — so the protocol the bridge speaks in the test is the
# protocol it speaks on a box, and `default-features = false` keeps llama.cpp (and thus
# the GGUF) out of the build: a session whose turns go to a provider needs neither.
letibot-harnessd = { workspace = true, default-features = false }

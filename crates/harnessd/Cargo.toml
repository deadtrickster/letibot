[package]
name = "letibot-harnessd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = ["local"]
# A local model: llama.cpp's tokenizer, so token ids can be sent to a llama-server.
local = ["dep:letibot-llama", "letibot-sessionlog/local", "letibot-turn/local"]

[dependencies]
letibot-transcript.workspace = true
letibot-dialect.workspace = true
letibot-dialect-glm.workspace = true
letibot-dialect-qwen.workspace = true
letibot-tokencore.workspace = true
# The GGUF vocabulary, for a daemon that runs a LOCAL model. Behind `local` (on by
# default) because it is the one dependency that needs llama.cpp to build; without it the
# daemon serves cloud providers only, and the build needs nothing but Rust.
letibot-llama = { workspace = true, optional = true }
letibot-backend.workspace = true
letibot-turn.workspace = true
letibot-tools.workspace = true
# The tree-sitter shape of a command, for the etalon map (`--etalon-map`).
letibot-code.workspace = true
# The flowy seat the daemon holds, and the `flowy` tool a root session gets.
letibot-flowy.workspace = true
# The cloud providers (D10 mode 3): the one crate with a TLS stack in it.
letibot-provider.workspace = true
letibot-websearch.workspace = true
# The curl fetcher behind `web_fetch` (`--web-fetch`).
letibot-webfetch.workspace = true
# R6: reading an opencode conversation into this session's rows.
letibot-opencode.workspace = true
# Package H: the same for a Claude Code transcript — reading it in, and writing one out.
letibot-claude.workspace = true
letibot-sessionlog = { workspace = true, features = ["turn", "tools"] }
# **The plugin layers and the panes they answer** (W4 of `docs/plugins-slice1.md`): the stack,
# the recorder, the shadow gate and the pane `View`, all in crates with no wasm engine in them.
letibot-plugins.workspace = true
# **The layers this binary carries** (`crates/builtins`): their modules are `include_bytes!`d into
# the daemon, so the `builtin` scope of every stack is the table this crate holds — and a head or
# a test reads the same table rather than a second copy of it.
letibot-builtins.workspace = true
# **The hook contracts, for the daemon's side of the wire** (`crates/plugin-sdk`): the four kinds'
# typed inputs and answers, which the listener below builds and parses rather than spelling them
# as JSON here. The same crate is what a guest plugin links, so a renamed field breaks both.
letibot-plugin.workspace = true
# The engine behind `letibot_plugins::Loader`: a plugin is a wasm module that answers text hooks,
# and rano is the host that loads one. This is the only reason the daemon links a JIT, and it is
# the price of running a plugin at all — see `crates/harnessd/src/plugins/rano.rs`.
rano = { git = "https://github.com/deadtrickster/rano", rev = "bf3fa48bdea77114df79e2734082a5dadbb21198" }
# The metrics writer thread and metrics.db (TODO R81): the daemon is the one that writes it.
letibot-metrics = { workspace = true, features = ["store"] }
serde.workspace = true
# preserve_order for the reason every crate in this tree needs it: a tool call's
# argument key order becomes prompt bytes on the next turn.
serde_json = { workspace = true, features = ["preserve_order"] }
# `prompts.toml` — the per-model system-prompt overrides. See the workspace
# manifest for why this is the one TOML the tree parses with a real parser.
toml.workspace = true
# Only for `sigaction` and the self-pipe that carries a signal to the shutdown
# thread. No async runtime, no HTTP client: the turn engine is a synchronous state
# machine and the log is threads and a condvar.
libc = "0.2"
# The fingerprint of a session's frozen prefix (`harness::prefix_fingerprint`). The same
# `sha2` `letibot-tokencore` content-addresses a stable prefix with, and already in this
# tree four times over, so the dependency argument was spent before it was needed here.
sha2 = "0.10"

[[bin]]
name = "harnessd"
path = "src/bin/harnessd.rs"

[[bin]]
name = "letibot-m1"
path = "src/bin/letibot-m1.rs"

[[test]]
name = "reprefill_feasibility"
required-features = ["local"]

[dev-dependencies]
letibot-tools = { workspace = true, features = ["testing"] }

[[bin]]
name = "letibot-askpass"
path = "src/bin/letibot-askpass.rs"

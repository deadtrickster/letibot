[package]
name = "letibot-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
letibot-sessionlog.workspace = true
letibot-transcript.workspace = true
# Rendering primitives: columns, wrapping, syntax colouring, the prefill bar, the
# tool card, and the composer's model half. See `crates/ui/DESIGN.md` — this head
# is the seam that crate was written against.
letibot-ui.workspace = true
# **The screen model**, and the head names it directly rather than through `letibot-ui`: the model
# is a crate *below* the painting crate, so `TermPane` holds the type it actually holds. The other
# half — a screen's cells drawn as this head's roles — is `letibot_ui::ansi`'s, which is why both
# are here.
letibot-vt.workspace = true
serde.workspace = true
serde_json.workspace = true
# The daemon's pid off the socket (`getsockopt`, in the driver) and the local clock
# (`localtime_r`). Raw mode and the window size are rano's now (`rano::term`). `libc` is
# already in the tree via the token core.
libc = "0.2"
# The incremental markdown engine (`rano::syntax::Stream`). Same deliberate absolute
# path and the same reasoning as `crates/ui/Cargo.toml`: rano is the operator-local
# tree-sitter hub, and a second tree-sitter integration in this process is the thing
# that dependency exists to prevent. The markdown *projection* — the block model, the
# inline styles, the window — stays here; rano hands back `Node`s and byte ranges and
# knows nothing about what a heading is.
#
# **And the terminal** (`rano::term`): raw mode, the row-diffing painter, the input decoder,
# the kitty graphics and OSC 8 protocols. rano reads the bytes into what was *pressed*; what a
# key *means* stays here, in `app::key_of`.
rano = { git = "https://github.com/deadtrickster/rano", tag = "v0.7.2" }

[[bin]]
name = "letibot-tui"
path = "src/bin/letibot-tui.rs"

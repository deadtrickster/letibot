# Голова letibot по-русски: только те строки, которые головной процесс рисует сам.
#
# Ключ тот же, что в en.toml; `{name}` — подстановка, её имя менять нельзя, а порядок слов в
# предложении можно. `\n` — перевод строки, `\"` и `\\` — сами себя.
#
# Чего здесь нет и не будет: ничего из отправленного модели, строки транскрипта, записи стора,
# строки лога, кода ошибки, имени команды и ключа конфигурации.


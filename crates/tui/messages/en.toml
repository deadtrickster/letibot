# The head's own words, in English - the source every other language is a translation of.
#
# One `id = "text"` line each. `{name}` is a value the caller supplies and must survive translation
# unchanged: a translated sentence keeps the placeholder and may move it. `\n` is a line break,
# `\"` and `\\` are themselves; nothing else is an escape.
#
# What is NOT here and never will be: anything sent to the model, transcript text, store rows, log
# lines, error codes, command names and config keys.


# The light palette this build ships - `dark`'s twin, for a terminal whose background is light.
# Every role is named, so nothing falls back to the terminal's own slots; `plain` carries the
# page's background, and the contrast test measures the others against it.

plain = "fg:#1b1f24 bg:#fbfaf7"
faint = "fg:#5a6472"
strong = "fg:#000000 bold"
heading = "fg:#0b4f9c bold"
subheading = "fg:#1560b0 bold"
user_accent = "fg:#2f6fd0"
user_block = "bg:#d6dce6"
success = "fg:#0f6b26"
info = "fg:#0b6480"
pending = "fg:#6b4a00"
warning = "fg:#8a4b00"
attention = "fg:#b32d00 bold underline"
failure = "fg:#a40e26"
reasoning = "fg:#4a5260 dim italic"
code = "fg:#1b1f24"
added = "bg:#a8e8bd"
removed = "bg:#f5bcb9"
emphasis = "bold underline"
keyword = "fg:#8b1c62"
string_lit = "fg:#0f6b26"
number_lit = "fg:#6b4a00"
comment = "fg:#6a7280 dim"
type_name = "fg:#0b6480"
func_name = "fg:#6639ba"
punctuation = "fg:#1b1f24"
link = "fg:#0b4f9c underline"
key = "fg:#0b4f9c"
bar = "reverse"
selected = "reverse"
match = "fg:#fbfaf7 bg:#8a5d00"
selection = "fg:#fbfaf7 bg:#2f6fd0"
diag_error = "fg:#a40e26"
diag_warning = "fg:#8a4b00"
diag_note = "fg:#1560b0"

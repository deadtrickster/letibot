# The dark palette this build ships. Every role is named, so nothing here falls back to the
# terminal's own sixteen slots: a reader who chooses `dark` gets the same colours on every box.
# `plain` carries the page's own background, which is what the contrast test measures every other
# role against. A name a theme does not need is deleted; a line overrides its role WHOLE.

plain = "fg:#d7dae0 bg:#10131a"
faint = "fg:#8b93a1"
strong = "fg:#f2f4f8 bold"
heading = "fg:#79b8ff bold"
subheading = "fg:#9ecbff bold"
user_accent = "fg:#4a7fd4"
user_block = "bg:#232b3a"
success = "fg:#56d364"
info = "fg:#56d4dd"
pending = "fg:#e3b341"
warning = "fg:#f0883e"
attention = "fg:#ff9f6e bold underline"
failure = "fg:#ff7b72"
reasoning = "fg:#a8b1c0 dim italic"
code = "fg:#c9d1d9"
added = "bg:#1b4721"
removed = "bg:#6b1b1b"
emphasis = "bold underline"
keyword = "fg:#ff7b9c"
string_lit = "fg:#a5d6a7"
number_lit = "fg:#ffab70"
comment = "fg:#7d8794 dim"
type_name = "fg:#7ee787"
func_name = "fg:#d2a8ff"
punctuation = "fg:#c9d1d9"
link = "fg:#58a6ff underline"
key = "fg:#79c0ff"
bar = "reverse"
selected = "reverse"
match = "fg:#10131a bg:#e3b341"
selection = "fg:#f2f4f8 bg:#264f78"
diag_error = "fg:#ff7b72"
diag_warning = "fg:#f0883e"
diag_note = "fg:#9ecbff"

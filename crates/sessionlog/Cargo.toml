[package]
name = "letibot-sessionlog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
letibot-transcript.workspace = true
# **The pane's shared vocabulary** (`letibot_plugin::pane`): a row's cell, its fold and the act a
# key performs. The SDK, not a copy: the same crate is compiled into a guest plugin, so the words
# the head parses and the words the plugin writes cannot drift apart. Serde and nothing else, so
# this adds no engine and no model to everything that depends on the log.
letibot-plugin.workspace = true
# The metrics event and its never-blocking channel (TODO R81) — without the `store` feature, so
# the head that depends on this crate links no SQLite. The hub tap and the feedback frame emit
# through it; the daemon installs the writer.
letibot-metrics.workspace = true
serde.workspace = true
# **The workspace key a folder's daemon is named by** (`lib.rs`'s `workspace_key`): the review
# queue's session id is `s-gatekeeper-<key>`, and a head that computes that key with a hash of its
# own is a second spelling of which folder a session belongs to. `sha2` is what `scripts/letibot`
# shells out to (`sha256sum | cut -c1-12`), so this is that rule written once in Rust.
sha2 = "0.10"
# preserve_order so a tool call's argument JSON survives a round trip through a
# frame with its key order intact. The same reason dialect-glm needs it: those
# bytes become prompt bytes again on the next turn.
serde_json = { workspace = true, features = ["preserve_order"] }

# The turn engine, for the lift from `TurnEvent` into §4.5's full enum. Optional
# and off by default so `cargo build -p letibot-sessionlog` proves the log, the
# protocol and the scrub have no path into a model, an FFI or a running server —
# which is what lets the TUI depend on this crate without linking libllama.
letibot-turn = { workspace = true, optional = true }

# The tool runtime, for the lift from `ToolEvent` into §4.5's three tool events.
# Optional for the same reason `letibot-turn` is: the log, the protocol and the
# scrub must be buildable with no path into a filesystem a tool can read.
letibot-tools = { workspace = true, optional = true }

# **llama.cpp only for the tests that need it** — the GGUF vocabulary, behind `local`.
# harnessd's `local` (its default) turns this on, so the operator's `cargo test` runs them;
# `--no-default-features` builds and tests everything else with no llama.cpp on the box.
letibot-llama = { workspace = true, optional = true }

[features]
default = ["local"]
turn = ["dep:letibot-turn"]
tools = ["dep:letibot-tools"]
local = ["dep:letibot-llama"]

[[test]]
name = "live_e2e"
required-features = ["local"]

[dev-dependencies]
# The writer, for the test that sends a mark and reads it back out of a temp metrics.db.
letibot-metrics = { workspace = true, features = ["store"] }
letibot-sessionlog = { path = ".", default-features = false, features = ["turn", "tools"] }
letibot-tools = { workspace = true, features = ["testing"] }
letibot-turn = { workspace = true, features = ["glm"] }
# For the live end-to-end test, which drives a real turn engine against the
# running server and attaches a head to it mid-turn.
letibot-dialect.workspace = true
letibot-tokencore.workspace = true
letibot-backend.workspace = true

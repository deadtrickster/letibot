[package]
name = "letibot-code"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The structural half of search, kept out of `letibot-tools` on purpose.
#
# Every grammar below is C and pulls a `cc` build. `letibot-tools`' own manifest
# says it has no `build.rs`, and the reason it gives -- a tool runtime that
# needed a native build to grep a file would be a layering mistake -- did not
# stop being true when the tool set grew a parser. So the parser is a crate, and
# `letibot-tools` depends on it the way it depends on `sha2`.
#
# Nothing else in the workspace has to. `letibot-code` knows about source text
# and line numbers; it does not know what a tool, a turn or a transcript is.
[dependencies]
# The grammars live in rano (`~/Projects/rano`), not here.
#
# This crate used to carry its own `tree-sitter` and six grammars — rust, python,
# go, c, bash, json — because the `cc` build had to live somewhere and
# `letibot-tools` deliberately has no `build.rs`. That reason is still good and
# this crate is still the place for it; what it was *also* doing was a second
# tree-sitter integration, which is what rano exists to prevent
# (`crates/ui/Cargo.toml` says so at length). Rano has all six grammars and
# twenty-two more, and one engine. Same deliberate absolute path as the other two
# consumers, for the same reason: rano is an operator-local project, not a
# published crate.
rano = { path = "/home/dead/Projects/rano/rano" }

[package]
name = "letibot-turn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
letibot-transcript.workspace = true
letibot-dialect.workspace = true
letibot-tokencore.workspace = true
letibot-http.workspace = true
letibot-backend.workspace = true
serde.workspace = true
# preserve_order for the same reason dialect-glm needs it: a tool call's argument
# key order becomes prompt bytes on the next turn, and reordering re-prefills.
serde_json = { workspace = true, features = ["preserve_order"] }

# The GLM adapter for the `PromptRenderer` seam. Optional and off by default, so
# `cargo build -p letibot-turn` proves the engine has no path into a concrete
# dialect; the tests turn it on.
letibot-dialect-glm = { workspace = true, optional = true }

# **llama.cpp only for the tests that need it** — the GGUF vocabulary, behind `local`.
# harnessd's `local` (its default) turns this on, so the operator's `cargo test` runs them;
# `--no-default-features` builds and tests everything else with no llama.cpp on the box.
letibot-llama = { workspace = true, optional = true }

[features]
default = ["local"]
glm = ["dep:letibot-dialect-glm"]
local = ["dep:letibot-llama"]

[[test]]
name = "compaction"
required-features = ["local"]

[[test]]
name = "engine_decisions"
required-features = ["local"]

[[test]]
name = "live_qwen"
required-features = ["local"]

[dev-dependencies]
letibot-turn = { path = ".", default-features = false, features = ["glm"] }
letibot-dialect-glm.workspace = true
# `kill(pid, 0)` — the liveness probe `tests/restore.rs` uses to tell a stale store copy from
# one a running test still owns. It is a test-only need, and portable where `/proc` is not.
libc = "0.2"

[package]
name = "letibot-transcript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# `re:` in a search query is a real pattern. It is a dependency of the ROW type's crate because
# the query and the rows it reads are one vocabulary: the head, the session list and the daemon's
# scan parse it here, so none can spell a tier the others do not.
regex = "1.13"

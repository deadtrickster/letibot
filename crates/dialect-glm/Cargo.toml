[package]
name = "letibot-dialect-glm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
letibot-transcript.workspace = true
letibot-dialect.workspace = true
serde = { workspace = true }
# preserve_order: a tool call's argument key order is part of the rendered bytes.
# Reordering them re-prefills the conversation, so serde_json must not sort.
serde_json = { workspace = true, features = ["preserve_order"] }

[[bin]]
name = "letibot-render"
path = "src/bin/letibot-render.rs"

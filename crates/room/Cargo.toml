[package]
name = "letibot-room"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# **Two dependencies, and the shortness is the design.** The room is a state machine with no
# store, no socket, no clock and no OS: the coordinator daemon (the next slice) owns all four, and
# a state machine that needed any of them could not be tested without them. `serde` is here
# because the wire is `crate::wire` and its frames are values.
#
# Slice 2 added the socket (`server`), the client (`client`) and the coordinator's lease
# (`lease`) — and `serde_json` with them, because a frame on the wire is one line of JSON. The
# queues' own store (`store`) is one append-only file beside the socket, not a database: no
# `tokencore`, because a crate that could reach one would eventually do it.
[dependencies]
serde.workspace = true
serde_json.workspace = true
# **A project's key is the tree's own twelve hex characters** (`tree::project_key`) — the same rule
# `letibot-sessionlog::workspace_key` and `scripts/letibot` use, so this crate cannot be the one that
# names a folder differently from the gatekeeper's session id. It is written here rather than
# imported because the room holds no store and no `tokencore`, and a test in `harnessd` pins the two
# spellings to one table (`crates/harnessd/tests/room_tree.rs`).
sha2 = "0.10"
# The tree's one base64 alphabet, for a blob part on a wire that is one line of JSON. The crate is
# serde and serde_json and nothing else, so it costs the room no second store or model connection.
letibot-transcript.workspace = true
# The tree's one wall clock, for the socket's beat and its sweep. The state machine still
# holds none: `server` reads it and hands the number in.
letibot-metrics.workspace = true
# `getsockopt(SO_PEERCRED)` and `getpeereid`, so the server can name the USER on the other end of
# its socket: the file mode says who may open it, and the kernel says who did.
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true

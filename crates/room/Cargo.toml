[package]
name = "letibot-room"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# **Two dependencies, and the shortness is the design.** The room is a state machine with no
# store, no socket, no clock and no OS: the coordinator daemon (the next slice) owns all four, and
# a state machine that needed any of them could not be tested without them. `serde` is here
# because the wire is `crate::wire` and its frames are values.
#
# Slice 2 added the socket (`server`), the client (`client`) and the coordinator's lease
# (`lease`) — and `serde_json` with them, because a frame on the wire is one line of JSON. Still
# no store and no `tokencore`: the coordinator keeps its queue in memory on purpose, and a crate
# that could reach a database would eventually do it.
[dependencies]
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

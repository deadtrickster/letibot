[package]
name = "letibot-tokencore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
letibot-transcript.workspace = true
letibot-dialect.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
sha2 = "0.10"
rusqlite = "0.40"


[dev-dependencies]
# `hooks` for the commit hook the contention test counts transactions with — a count, where a
# wall-clock ratio was a flake under a loaded box.
rusqlite = { version = "0.40", features = ["hooks"] }
